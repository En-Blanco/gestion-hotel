<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/styles-login.css">

</head>

<body>

    <!-- TITULO PRINCIPAL OCULTO PARA VALIDACION -->

    <h1 class="hidden-title">
        Sistema de Gestión Hotelera
    </h1>

    <!-- CONTENEDOR LOGIN -->

    <div class="login-container">

        <!-- TARJETA -->

        <div class="login-card">

            <!-- HEADER -->

            <header class="login-header">

                <img src="assets/isologo.png" alt="Logo Hotel" class="logo">

                <p>Iniciá sesión para continuar</p>

            </header>

            <!-- FORMULARIO -->

            <form class="login-form">

                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input type="email" id="email" placeholder="Ingrese su correo">

                </div>

                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password" id="password" placeholder="Ingrese su contraseña">

                </div>

                <!-- BOTONES ROL -->

                <div class="role-buttons">

                    <a href="dashboard_user.html" class="role-btn">
                        Cliente

                    </a>

                    <a href="dashboard_admin.html" class="role-btn">
                        Administrador

                    </a>

                </div>

                <!-- RECUPERAR -->

                <div class="options">

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <!-- BOTON -->

                <button type="submit" class="login-btn">

                    Ingresar

                </button>

            </form>

            <!-- REGISTRO -->

            <div class="register-link">

                <p>
                    ¿No tenés cuenta?
                    <a href="registro.html">
                        Registrarse
                    </a>
                </p>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <footer class="footer-content">
        <section class="footer-contacto">
            <h3>Contacto</h3>
            <a href="mailto:tucorreo@mail.com"> info@enblanco.com</a>
            <a href="tel:+540000000000"> +54 000 000-0000</a>
        </section>

        <section class="footer-redes">
            <h3>Redes</h3>
            <a href="https://instagram.com" target="_blank"> Instagram</a>
            <a href="https://linkedin.com/in" target="_blank"> LinkedIn</a>
        </section>

        <div class="footer-copy">
            <p>© 2026 En Blanco - Gestión Hotelera. Todos los derechos reservados.</p>
        </div>


    </footer>

</body>
