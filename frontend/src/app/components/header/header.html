<header
  class="navbar navbar-expand-lg sticky-top px-4 py-2 shadow-sm"
  style="background-color: var(--light-bg); z-index: 100"
>
  <div class="container-fluid p-0">
    <a class="navbar-brand p-0 m-0" routerLink="/">
      <img src="assets/isologo.png" alt="En Blanco - Gestión Hotelera" style="height: 80px" />
    </a>

    <button
      class="navbar-toggler border-0 shadow-none"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <nav class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <div
        class="navbar-nav rounded-3 overflow-hidden text-center text-lg-start"
        style="background-color: var(--primary)"
      >
        <a
          class="nav-link text-white fw-bold px-3 py-2"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Inicio</a
        >
        <a
          class="nav-link text-white fw-bold px-3 py-2 border-top border-lg-0"
          routerLink="/sobre-nosotros"
          routerLinkActive="active"
          >Quiénes somos</a
        >
        <a
          class="nav-link text-white fw-bold px-3 py-2 border-top border-lg-0"
          routerLink="/login"
          routerLinkActive="active"
          >Iniciar sesión</a
        >
        <a
          class="nav-link text-white fw-bold px-3 py-2 border-top border-lg-0"
          routerLink="/registro"
          routerLinkActive="active"
          >Registrarse</a
        >
      </div>
    </nav>
  </div>
</header>
